name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build -p opencad_mining --release --locked
      # Benchmarks must keep compiling; they are run manually.
      - run: cargo bench -p drillhole_engine -p blockmodel_engine --no-run --locked

  # Native AI tools (plugin API 25+) compile against the host's main branch.
  # Informative: the published host is still API 23, so this never blocks.
  api-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Point ocs_plugin_api at the host's main branch
        run: |
          sed -i 's#rev = "[0-9a-f]*", features = \["host"\]#branch = "main", features = ["host"]#' crates/opencad_mining/Cargo.toml
          grep ocs_plugin_api crates/opencad_mining/Cargo.toml
          cargo update -p ocs_plugin_api
      - run: cargo build -p opencad_mining --features api25

  # End-to-end test against the official Open CAD Studio release: the plugin is
  # loaded by the real host and every module is driven over `--serve`.
  host-smoke:
    runs-on: ubuntu-latest
    env:
      # Host release whose plugin API matches plugin.toml (api_version 23).
      OCS_VERSION: v2026.46
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download Open CAD Studio
        run: |
          curl -fsSL -o ocs.AppImage \
            "https://github.com/HakanSeven12/OpenCADStudio/releases/download/${OCS_VERSION}/OpenCADStudio-${OCS_VERSION}-linux-x86_64.AppImage"
          chmod +x ocs.AppImage
          ./ocs.AppImage --appimage-extract > /dev/null
          ls squashfs-root
      - name: Runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libxkbcommon0 libwayland-client0
      - name: Smoke test
        run: xvfb-run -a timeout 900 python3 scripts/smoke_serve.py "$PWD/squashfs-root/AppRun" --install
